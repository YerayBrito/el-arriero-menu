<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="900" height="700" viewBox="0 0 900 700">
  <defs>
    <linearGradient id="bg2" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#fdf8f0"/>
      <stop offset="1" stop-color="#efe5d5"/>
    </linearGradient>
    <linearGradient id="gold" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#b8933e" stop-opacity="0.95"/>
      <stop offset="1" stop-color="#b8933e" stop-opacity="0.55"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="18" stdDeviation="18" flood-color="#000" flood-opacity="0.20"/>
    </filter>
  </defs>

  <rect width="900" height="700" rx="44" fill="url(#bg2)"/>

  <!-- Card -->
  <g filter="url(#shadow)">
    <rect x="110" y="110" width="680" height="480" rx="36" fill="#ffffff" opacity="0.62"/>
    <rect x="110" y="110" width="680" height="480" rx="36" fill="none" stroke="#b8933e" stroke-opacity="0.32" stroke-width="2"/>
  </g>

  <!-- Minimal "menu" lines -->
  <rect x="180" y="200" width="420" height="18" rx="9" fill="#1e3a5f" opacity="0.20"/>
  <rect x="180" y="245" width="520" height="12" rx="6" fill="#1e3a5f" opacity="0.14"/>
  <rect x="180" y="275" width="480" height="12" rx="6" fill="#1e3a5f" opacity="0.14"/>

  <rect x="180" y="340" width="380" height="18" rx="9" fill="#1e3a5f" opacity="0.20"/>
  <rect x="180" y="385" width="500" height="12" rx="6" fill="#1e3a5f" opacity="0.14"/>

  <!-- Price tags -->
  <rect x="640" y="195" width="90" height="28" rx="14" fill="url(#gold)" opacity="0.9"/>
  <rect x="610" y="335" width="120" height="28" rx="14" fill="url(#gold)" opacity="0.75"/>

  <!-- Tiny allergen dots -->
  <circle cx="182" cy="455" r="12" fill="#f2a51a"/>
  <circle cx="215" cy="455" r="12" fill="#2aa6df"/>
  <circle cx="248" cy="455" r="12" fill="#2457b6"/>
  <circle cx="281" cy="455" r="12" fill="#45a548"/>
  <circle cx="314" cy="455" r="12" fill="#7b1b7a"/>
</svg>

