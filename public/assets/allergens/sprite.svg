  <!--
    Iconos en SVG como ayuda visual.
    La obligacion legal es INFORMAR de los alergenos (UE 1169/2011);
    el icono no sustituye al texto.
  -->

  <!-- Estilo: circulo color + pictograma blanco -->

  <symbol id="gluten" viewBox="0 0 24 24">
    <circle class="c-gl" cx="12" cy="12" r="11"/>
    <path class="s" d="M12 6c-2 2-2 4 0 6-2 2-2 4 0 6"/>
    <path class="s" d="M10 8c1 1 3 1 4 0M10 16c1-1 3-1 4 0" opacity=".9"/>
    <text class="t" x="12" y="21" text-anchor="middle">GLUTEN</text>
  </symbol>

  <symbol id="crustaceos" viewBox="0 0 24 24">
    <circle class="c-cr" cx="12" cy="12" r="11"/>
    <path class="s" d="M8 11c1-2 7-2 8 0s-1 6-4 6-5-4-4-6Z"/>
    <path class="s" d="M7 11l-2-1M17 11l2-1"/>
    <path class="s" d="M10 9l-1-2M14 9l1-2" opacity=".85"/>
    <text class="t" x="12" y="21" text-anchor="middle">CRUSTACEOS</text>
  </symbol>

  <symbol id="huevo" viewBox="0 0 24 24">
