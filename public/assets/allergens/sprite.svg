    <path class="s" d="M18 12l3-2v4l-3-2Z"/>
    <circle cx="10.4" cy="12" r="1" fill="#fff"/>
    <text class="t" x="12" y="21" text-anchor="middle">PESCADO</text>
  </symbol>

  <symbol id="cacahuetes" viewBox="0 0 24 24">
    <circle class="c-ca" cx="12" cy="12" r="11"/>
