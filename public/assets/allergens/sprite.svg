<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" style="display:none">
  <defs>
    <style>
      .w{fill:#fff}
      .s{fill:none;stroke:#fff;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
      .t{fill:#fff;font-family:system-ui, -apple-system, Segoe UI, Arial, sans-serif;font-weight:700;font-size:6.3px;letter-spacing:.6px}
      .c-gl{fill:#f2a51a}
      .c-cr{fill:#2aa6df}
      .c-hv{fill:#f0b31a}
      .c-pe{fill:#2457b6}
      .c-ca{fill:#c1843b}
      .c-so{fill:#45a548}
      .c-le{fill:#7b4a1e}
      .c-fs{fill:#d14a3a}
      .c-ap{fill:#3aa55a}
      .c-ms{fill:#caa21a}
      .c-se{fill:#b7a384}
      .c-su{fill:#7b1b7a}
      .c-al{fill:#f4d13f}
      .c-mo{fill:#59b9d5}
    </style>
