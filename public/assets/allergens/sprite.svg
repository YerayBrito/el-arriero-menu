  <symbol id="moluscos" viewBox="0 0 24 24">
    <circle class="c-mo" cx="12" cy="12" r="11"/>
    <path class="s" d="M7.5 12c0-3 2-5 4.5-5s4.5 2 4.5 5-2 6-4.5 6-4.5-3-4.5-6Z"/>
